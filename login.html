<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing page MMD</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="main.css">
</head>

<body>
  <div class="toast-error" id="toastError" role="alert">
    <span class="toast-icon">!</span>
    <div>
      <strong>ورود ناموفق</strong>
      <p>رمز عبور صحیح نیست.</p>
    </div>
  </div>

  <main class="page">
    <strong class="topic">login</strong>

    <div class="form-container">
      <form class="form" id="loginForm">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="lock-icon"
          viewBox="0 0 24 24"
          fill="currentColor"
          aria-hidden="true"
        >
          <path
            d="M12 2C9.243 2 7 4.243 7 7v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7c0-2.757-2.243-5-5-5zM9 7c0-1.654 1.346-3 3-3s3 1.346 3 3v3H9V7zm4 10.723V20h-2v-2.277a1.993 1.993 0 0 1 .567-3.677A2.001 2.001 0 0 1 14 16a1.99 1.99 0 0 1-1 1.723z"
          />
        </svg>

        <p class="form-title">Welcome back</p>
        <p class="form-sub-title">
          Enter your password to log in to your panel.
        </p>

        <div class="login-card">
          <div class="field-container">
            <input
              class="input"
              type="password"
              id="password"
              placeholder=" "
              required
            >
            <span class="placeholder">Password</span>
          </div>

          <button class="btn" type="submit">
            <span class="btn-label">Continue</span>
          </button>
        </div>
      </form>
    </div>
  </main>

  <script>
    const loginForm = document.getElementById("loginForm");
    const passwordInput = document.getElementById("password");
    const toastError = document.getElementById("toastError");

    let toastTimer;

    loginForm.addEventListener("submit", function (event) {
      event.preventDefault();

      if (passwordInput.value === "1234") {
        window.location.href = "index.html";
        return;
      }

      toastError.classList.add("show");

      passwordInput.value = "";
      passwordInput.focus();

      clearTimeout(toastTimer);

      toastTimer = setTimeout(function () {
        toastError.classList.remove("show");
      }, 3000);
    });
  </script>
</body>
</html>
